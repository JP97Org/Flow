quarkus.application.name=flow
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.ssl-port=0

quarkus.smallrye-openapi.info-title=Flow Chart Calculator API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for creating, editing, validating, simulating and persisting flow charts.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.store-schema-file-name=openapi
quarkus.smallrye-openapi.operation-id-strategy=METHOD
quarkus.smallrye-openapi.open-api-version=3.0.3
quarkus.smallrye-openapi.servers=/
quarkus.swagger-ui.always-include=true

%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200
